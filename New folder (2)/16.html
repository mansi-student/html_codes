<!DOCTYPE html>
<html>
<head>
    <title>Zig Zag Marquee</title>
</head>
<body>

    <!-- Vertical bouncing marquee -->
    <marquee direction="up" height="400" behavior="alternate">
        <img src="radha rani.jpg" height="100" width="100" style="border-radius:50%;">
    </marquee>

    <!-- Horizontal bouncing marquee -->
    <marquee direction="left" behavior="alternate">
        <img src="radha rani.jpg" height="100" width="100" style="border-radius:50%;">
    </marquee>

</body>
</html>
